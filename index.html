<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגה מקדימה – שאלון יום 6</title>
<style>
  :root {
    --page: #f4f5f8;
    --card: #1a1a2e;
    --card-edge: #26264a;
    --row: #12121f;
    --row-edge: #2a2a44;
    --text: #f2f2f8;
    --muted: #8b8ba3;
    --accent: #6d4fe8;
    --accent-hover: #8467f5;
    --selected-bg: #2a2a66;
    --selected-edge: #5b5be0;
    --required: #ef4444;
    --tag-bg: #e3e4ea;
    --tag-text: #5a5a70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    font-family: "Assistant", "Heebo", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .q-tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin: 10px 0 4px;
    direction: ltr;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 24px 28px 22px;
  }
  .q-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.6;
    margin: 0 0 6px;
  }
  .q-title .req { color: var(--required); margin-inline-start: 6px; }
  .q-sub { font-size: 14px; font-weight: 600; line-height: 1.6; margin: 10px 0 16px; }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--row);
    border: 1px solid var(--row-edge);
    border-radius: 6px;
    padding: 11px 14px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: background .15s, border-color .15s;
  }
  .opt:hover { border-color: #3b3b63; }
  .opt.on { background: var(--selected-bg); border-color: var(--selected-edge); }
  .opt input { display: none; }
  .box {
    width: 13px; height: 13px;
    border: 1.5px solid #9a9ab4;
    border-radius: 2px;
    display: grid; place-items: center;
    flex: none;
  }
  .opt.on .box { background: #fff; border-color: #fff; }
  .opt.on .box::after {
    content: "";
    width: 6px; height: 3px;
    border-inline-start: 2px solid var(--selected-bg);
    border-bottom: 2px solid var(--selected-bg);
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .opt:focus-within { outline: 2px solid var(--accent-hover); outline-offset: 2px; }

  textarea, .pts {
    width: 100%;
    background: var(--row);
    color: var(--text);
    border: 1px solid var(--row-edge);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    padding: 12px 14px;
    direction: rtl;
  }
  textarea { min-height: 76px; resize: vertical; }
  textarea::placeholder, .pts::placeholder { color: var(--muted); }
  textarea:focus, .pts:focus { outline: 2px solid var(--accent-hover); outline-offset: 1px; }
  .pts { margin: -2px 0 2px; }
  .pts[hidden] { display: none; }

  .counter { font-size: 10px; color: var(--muted); margin-top: 10px; text-align: left; direction: ltr; }
  .submit {
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 22px;
    cursor: pointer;
    display: block;
    margin-inline-end: auto;
  }
  .submit:hover { background: var(--accent-hover); }
  .submit:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .submit.done { background: #2f9e6e; }
  .note { text-align: center; color: #7b7b92; font-size: 12px; margin-top: 28px; }
  @media (max-width: 600px) { .card { padding: 18px 16px; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* ===== עריכה: כאן מגדירים את השאלון ===== */
const SURVEY = [
  {
    id: "Q1",
    type: "allocate",
    title: "יש לך 10 נקודות לחלק בין המפלגות שאתה/ה שוקל/ת להצביע להן. ככל שאתה/ה בטוח/ה יותר שתצביע/י למפלגה מסוימת – תן/י לה יותר נקודות. כמה נקודות תתן/י לכל אחת?",
    subtitle: "אנא בחר/י קודם בשם המפלגה ואז כתוב/י את מספר הנקודות שתעניק/י לה",
    max: 10,
    options: [
      "הדמוקרטים", "הליכוד", "ישר!", "ישראל ביתנו", "ביחד", "עוצמה יהודית",
      "הציונות הדתית", "כחול לבן", "הכלכלית-המילואימניקים", "ש\"ס", "רע\"מ",
      "הרשימה המאוחדת", "עמך ישראל"
    ]
  },
  { id: "Q2", type: "open", title: "איזו עצה היית נותן לגולן כדי לשכנע אנשים כמוך להצביע לו?" },
  { id: "Q3", type: "open", title: "איזו עצה היית נותן לבנט כדי לשכנע אנשים כמוך להצביע לו?" },
  { id: "Q4", type: "open", title: "איזו עצה היית נותן לאיזנקוט כדי לשכנע אנשים כמוך להצביע לו?" },
  {
    id: "Q5",
    type: "open",
    title: "תודה על השתתפותך! נשמח לשמוע איך הייתה החוויה שלך מהפאנל בשבועות האחרונים, למה התחברת יותר ולמה פחות? האם יש משהו שישפיע על הנכונות שלך להשתתף שוב בעתיד?"
  }
];
/* ======================================= */

const app = document.getElementById("app");

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v);
  }
  kids.forEach(k => n.append(k));
  return n;
}

function titleEl(q) {
  const h = el("p", { class: "q-title" });
  h.append(document.createTextNode(q.title));
  h.append(el("span", { class: "req", text: "*" }));
  return h;
}

function submitBtn() {
  const b = el("button", { class: "submit", type: "button", text: "Submit" });
  b.addEventListener("click", () => {
    b.textContent = "Submitted";
    b.classList.add("done");
    setTimeout(() => { b.textContent = "Submit"; b.classList.remove("done"); }, 1400);
  });
  return b;
}

function renderAllocate(q) {
  const card = el("section", { class: "card" });
  card.append(titleEl(q));
  card.append(el("p", { class: "q-sub", text: q.subtitle }));
  const list = el("div", { class: "opts" });
  const counter = el("div", { class: "counter" });
  const update = () => {
    const n = list.querySelectorAll(".opt.on").length;
    counter.textContent = n + " of " + q.max + " selected";
  };
  q.options.forEach(name => {
    const cb = el("input", { type: "checkbox" });
    const row = el("label", { class: "opt" }, cb, el("span", { class: "box" }), el("span", { text: name }));
    const pts = el("input", { class: "pts", type: "text", inputmode: "numeric", placeholder: "נא לפרט (חובה)" });
    pts.hidden = true;
    cb.addEventListener("change", () => {
      row.classList.toggle("on", cb.checked);
      pts.hidden = !cb.checked;
      if (cb.checked) pts.focus(); else pts.value = "";
      update();
    });
    list.append(row, pts);
  });
  update();
  card.append(list, counter, submitBtn());
  return card;
}

function renderOpen(q) {
  const card = el("section", { class: "card" });
  card.append(titleEl(q));
  card.append(el("textarea", { placeholder: "הקלד/י את תשובתך כאן", "aria-label": q.title }));
  card.append(submitBtn());
  return card;
}

SURVEY.forEach(q => {
  app.append(el("div", { class: "q-tag", text: q.id }));
  app.append(q.type === "allocate" ? renderAllocate(q) : renderOpen(q));
});
app.append(el("p", { class: "note", text: "תצוגה מקדימה בלבד – התשובות אינן נשמרות" }));
</script>
</body>
</html>
